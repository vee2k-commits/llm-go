<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puddle Hopper — Vee Arcade</title>
<link rel="stylesheet" href="../engine/vee-style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  #stage {
    display: block; width: 100%; height: 100%;
    touch-action: none;                    /* swipes belong to the game */
    cursor: pointer;
  }
  /* pill control cluster — top-right, 56px targets for small hands */
  #ctrl { position: fixed; top: 8px; right: 8px; display: flex; gap: 10px; z-index: 20; }
  #ctrl .vee-btn {
    min-width: 56px; min-height: 56px; width: 56px; padding: 0;
    font-size: var(--text-sm); line-height: 1;
  }
  #ctrl .vee-btn.is-off { background: var(--paper-3); }
  /* paper-style inline icons — no glyph-font dependency (D7) */
  .ctrl-ic { display: block; width: 26px; height: 26px; pointer-events: none; }
  .vee-overlay { position: fixed; }
  .vee-card .ctl-row { display: flex; gap: 14px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .vee-card .howto {
    display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
    margin-top: 18px; color: var(--ink-soft); font-size: var(--text-xs); font-weight: 600;
  }
  .vee-card .howto span { display: inline-flex; align-items: center; gap: 6px; }
  .vee-card .big-score { font-size: var(--text-lg); margin: 6px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body class="vee">
<canvas id="stage"></canvas>

<div id="ctrl">
  <button id="btnPause" class="vee-btn" aria-label="Pause" title="Pause (Esc)"><svg class="ctrl-ic" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 7v12M16.5 7v12"/></svg></button>
  <button id="btnSound" class="vee-btn" aria-label="Sound on/off" title="Sound"><svg class="ctrl-ic" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 18.5V7.5l8-2v11"/><circle cx="7.5" cy="18.5" r="2.2"/><circle cx="15.5" cy="16.5" r="2.2"/></svg></button>
  <button id="btnJuice" class="vee-btn" aria-label="Reduce motion" title="Calm mode (J)"><svg class="ctrl-ic" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l2.1 6.9L22 13l-6.9 2.1L13 22l-2.1-6.9L4 13l6.9-2.1z"/></svg></button>
  <button id="btnQuit" class="vee-btn vee-btn--ghost" aria-label="Quit to arcade" title="Quit"><svg class="ctrl-ic" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 8l10 10M18 8L8 18"/></svg></button>
</div>

<!-- title card -->
<div id="ovlTitle" class="vee-overlay">
  <div class="vee-card vee-panel vee-panel--taped">
    <h1>Puddle Hopper</h1>
    <p style="font-size:var(--text-sm); margin:10px 0 0;">
      Violet needs to get home! Hop across the toy-block road and the
      tissue-paper river, then fill every puddle house.
    </p>
    <div class="howto">
      <span>⬆ ⬇ ⬅ ➡ hop</span>
      <span>👆 tap a side</span>
      <span>〰️ swipe</span>
      <span>Esc pause</span>
    </div>
    <div class="ctl-row">
      <button id="btnStart" class="vee-btn vee-btn--violet">Let's hop!</button>
    </div>
  </div>
</div>

<!-- pause card -->
<div id="ovlPause" class="vee-overlay hidden">
  <div class="vee-card vee-panel vee-panel--taped">
    <h2>Taking a breather</h2>
    <div class="ctl-row">
      <button id="btnResume" class="vee-btn vee-btn--leaf">Keep hopping</button>
      <button id="btnRestart" class="vee-btn">Start over</button>
      <button id="btnQuit2" class="vee-btn vee-btn--ghost">Quit</button>
    </div>
  </div>
</div>

<!-- gentle game-over card — never scary -->
<div id="ovlOver" class="vee-overlay hidden">
  <div class="vee-card vee-panel vee-panel--taped">
    <h2>Great try!</h2>
    <p style="margin:6px 0 0;">Violet hopped her heart out.</p>
    <div class="big-score vee-score" id="finalScore">0</div>
    <p id="bestLine" style="margin:0; color:var(--ink-soft); font-size:var(--text-xs); font-weight:600;"></p>
    <div class="ctl-row">
      <button id="btnAgain" class="vee-btn vee-btn--violet">Hop again</button>
      <button id="btnQuit3" class="vee-btn vee-btn--ghost">Quit</button>
    </div>
  </div>
</div>

<script src="../engine/vee-game.js"></script>
<script src="../engine/vee-sfx.js"></script>
<script src="game.js"></script>
<script>
  window.PuddleHopper.start(document.getElementById("stage"), { mode: "play" });
</script>
</body>
</html>
