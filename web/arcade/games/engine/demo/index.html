<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vee Engine Demo</title>
<link rel="stylesheet" href="../vee-style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FFF6E4; }
  #stage { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    font-size: 18px; color: #5C4A6E; pointer-events: none;
  }
</style>
</head>
<body class="vee">
<canvas id="stage"></canvas>
<div id="hint">Space jump · C pop · V coin · B celebrate · N gentle fail · M music · J reduced-juice · Esc quit</div>
<script src="../vee-game.js"></script>
<script src="../vee-sfx.js"></script>
<script>
(function () {
"use strict";
var VG = window.VeeGame, D = VG.DESIGN, C = D.colors;
var harness = VG.createHarness("engine-demo");

var cv = VG.setupCanvas(document.getElementById("stage"));
var ctx = cv.ctx, view = cv.view;

var particles = new VG.ParticlePool();
var shake = VG.createShake();
var flash = VG.createFlash();
var input = VG.createInput();
var score = new VG.ScoreCounter();
var bounceStep = 0;

/* ---------------------------------------------------- world state ------- */
var scroll = 0;                                    // parallax driver
var ball = { x: 480, y: 200, vy: 0, sx: 1, sy: 1, squashUntil: 0, squashFrom: 0 };
var GRAV = 900, FLOOR = 520;
var celebrating = null;
var dizzyUntil = 0;

/* ---------------------------------------------------- demo helpers ------ */
function jumpBall() {
  if (ball.y > FLOOR - 4 || input.consumeBuffered("up")) {
    ball.vy = -460;
    ball.sx = D.squash.jumpLaunch.sx; ball.sy = D.squash.jumpLaunch.sy;
    ball.squashUntil = performance.now() + D.squash.jumpLaunch.ms;
    ball.squashFrom = performance.now();
    VeeSFX.jump();
    particles.spawn(4, { x: ball.x, y: FLOOR, kind: "spark", speed: 60, ttl: 0.5,
                          size: 3, color: C.paper3, gravity: 200, up: 40 });
  }
}
function doPop() {
  VeeSFX.unlock();
  loop.hitStop(D.budgets.hitStop.normal);          // 60ms hit-stop
  shake.trigger(3);                                 // shake 3px (good hit)
  particles.burst("explosion", ball.x, ball.y);
  VeeSFX.pop();
  score.add(50);
}
function doCoin() {
  VeeSFX.unlock();
  particles.burst("spark", ball.x, ball.y - 40);
  VeeSFX.coin();
  score.add(100);
}
function doCelebrate() {
  if (celebrating) return;
  VeeSFX.unlock();
  celebrating = VG.celebrate(
    { loop: loop, particles: particles, flash: flash },
    {
      cx: view.w / 2, cy: view.h * 0.4,
      note: function (i) { VeeSFX.fanfare(i); },
      card: function (o) { cardAnim = { t0: performance.now(), ms: o.ms, rise: o.rise }; },
      finish: function () {
        celebrating = null; cardAnim = null;
        var res = harness.submitScore(score.value);
        harness.gameEnded(score.value);
        if (res.newRecord) VeeSFX.sticker();
      }
    }
  );
  score.add(500);
}
function doGentleFail() {
  dizzyUntil = performance.now() + 1200;
  VeeSFX.gentleFail();                             /* sigh, never shake/flash */
}
var cardAnim = null;

/* ---------------------------------------------------- input ------------- */
function unlock() { VeeSFX.unlock(); }
window.addEventListener("pointerdown", unlock, { once: false });
window.addEventListener("keydown", unlock, { once: true });

input.onAction(function (a) {
  if (celebrating) { celebrating.skip(); return; }   // consent rule
  if (a === "action") jumpBall();
});
window.addEventListener("keydown", function (e) {
  var k = e.key.toLowerCase();
  if (k === "c") doPop();
  if (k === "v") doCoin();
  if (k === "b") doCelebrate();
  if (k === "n") doGentleFail();
  if (k === "m") { musicOn = !musicOn;
    if (musicOn) VeeSFX.startMusic({ bpm: 100, seed: 42 }); else VeeSFX.stopMusic(); }
  if (k === "j") VG.Juice.toggle();
  if (k === "escape") { harness.gameQuit(score.value); }
});
var musicOn = false;

/* ---------------------------------------------------- fixed-step sim ---- */
var loop = VG.createLoop({
  update: function (dt) {
    scroll += dt * 60;
    /* ball physics + squash recovery */
    ball.vy += GRAV * dt;
    ball.y += ball.vy * dt;
    if (ball.y >= FLOOR) {
      ball.y = FLOOR;
      if (ball.vy > 120) {
        VeeSFX.bounce(bounceStep++);               /* pitch ladder */
        ball.sx = D.squash.landing.sx; ball.sy = D.squash.landing.sy;
        ball.squashFrom = performance.now();
        ball.squashUntil = ball.squashFrom + D.squash.landing.msDown + D.squash.landing.msRecover;
        particles.spawn(4, { x: ball.x, y: FLOOR, kind: "spark", speed: 50, ttl: 0.4,
                             size: 3, color: C.paper3, gravity: 150 });
      }
      ball.vy = -Math.abs(ball.vy) * 0.92;
      if (Math.abs(ball.vy) < 180) { ball.vy = -380; bounceStep = 0; }
    }
    /* squash eases back to 1 over the recovery window */
    var t = (performance.now() - ball.squashFrom) / Math.max(1, ball.squashUntil - ball.squashFrom);
    if (t < 1) {
      var e = D.easing.pop(Math.max(0, t));
      ball.sx = 1 + (ball.sx > 1 ? 1 : -1) * Math.abs(ball.sx - 1) * (1 - e);
    } else { ball.sx = 1; ball.sy = 1; }
    ball.sy = 2 - ball.sx;                          /* volume preservation */
    particles.update(dt);
    score.update();
    if (celebrating) celebrating.update(dt * 1000);
  },
  render: function (alpha) { render(); }
});

/* ---------------------------------------------------- drawing ----------- */
function render() {
  var w = view.w, h = view.h, s = view.scale;
  ctx.save();
  var off = shake.offset();
  ctx.translate(off[0], off[1]);

  /* L0 sky — flat paper + grain (0.1) */
  ctx.fillStyle = C.paper;
  ctx.fillRect(-8, -8, w + 16, h + 16);
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = VG.pattern(ctx, "grain", null, 7);
  ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = 1;
  var par = VG.Juice.reduced ? 0 : scroll;         /* parallax frozen in reducedJuice */
  /* paper sun at 0.1x */
  VG.drawSprite(ctx, { x: w * 0.8 - (par * 0.1) % (w + 200), y: 90 * s, w: 90 * s, h: 90 * s,
    blob: true, fill: C.sun, seed: "sun", scale: s });
  /* clouds */
  for (var ci = 0; ci < 3; ci++) {
    var cx0 = ((ci * 420 - par * 0.1) % (w + 300) + w + 300) % (w + 300) - 150;
    VG.drawSprite(ctx, { x: cx0, y: (70 + ci * 40) * s, w: 130 * s, h: 46 * s,
      blob: true, fill: "#FFFDF2", seed: "cloud" + ci, scale: s, highlight: false });
  }

  /* L1 far hills (0.25, silhouettes, no outlines) */
  ctx.fillStyle = C.paper3;
  for (var hi = 0; hi < 4; hi++) {
    var hx = ((hi * 380 - par * 0.25) % (w + 400) + w + 400) % (w + 400) - 200;
    VG.wobblyBlobPath(ctx, hx, FLOOR + 90 * s, 200 * s, 90 * s, "hill" + hi, 7);
    ctx.fill();
  }

  /* L2 mid trees (0.5, outlines on) */
  for (var ti = 0; ti < 4; ti++) {
    var tx = ((ti * 340 + 120 - par * 0.5) % (w + 300) + w + 300) % (w + 300) - 150;
    VG.drawSprite(ctx, { x: tx, y: FLOOR - 30 * s, w: 46 * s, h: 60 * s,
      fill: C.leaf, seed: "tree" + ti, scale: s, radius: 10 });
  }

  /* L3 play — floor strip + wobble bricks + ball */
  ctx.fillStyle = C.paper2;
  ctx.fillRect(0, FLOOR + 14, w, h - FLOOR);
  VG.crayonStroke(ctx, [[0, FLOOR + 14], [w, FLOOR + 14]], C.inkSoft, 2);

  var brickColors = [C.violet, C.sky, C.berry, C.sun, C.leaf];
  for (var b = 0; b < 5; b++) {
    VG.drawSprite(ctx, { x: w * 0.12 + b * 90 * s, y: FLOOR - 130 * s,
      w: 74 * s, h: 34 * s, fill: brickColors[b], seed: "brick" + b,
      scale: s, texture: b % 2 ? "halftone" : null, radius: 6 });
  }

  /* the bouncing paper wad (wobble blob, squash & stretch, dizzy wobble) */
  var dizzy = performance.now() < dizzyUntil;
  ctx.save();
  if (dizzy) { ctx.translate(ball.x, ball.y); ctx.rotate(Math.sin(performance.now() / 90) * 0.12); ctx.translate(-ball.x, -ball.y); }
  ctx.translate(ball.x, ball.y);
  ctx.scale(ball.sx, ball.sy);
  ctx.translate(-ball.x, -ball.y);
  VG.drawSprite(ctx, { x: ball.x, y: ball.y, w: 64 * s, h: 64 * s,
    blob: true, fill: C.violet, seed: "ball", scale: s });
  ctx.restore();
  if (dizzy) {
    /* star eyes — gentle failure is cute, never scary */
    ctx.fillStyle = C.sun;
    ctx.font = "700 " + Math.max(18, 22 * s) + "px 'Baloo 2','Comic Sans MS',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("✶ ✶", ball.x, ball.y + 4 * s);
  }

  /* L4 near — foreground grass strip (1.3, oversized) */
  ctx.fillStyle = C.leaf;
  for (var gi = 0; gi < 12; gi++) {
    var gx = ((gi * 130 - par * 1.3) % (w + 160) + w + 160) % (w + 160) - 80;
    VG.wobblyBlobPath(ctx, gx, h + 18, 46 * s, 34 * s, "grass" + gi, 6);
    ctx.fill();
  }

  particles.render(ctx);

  /* HUD — washi panel + tabular score (18px floor) */
  VG.washiPanel(ctx, 24, 24, 300 * s, 76 * s, { scale: s, tape: C.sky });
  ctx.fillStyle = C.ink;
  ctx.font = "700 " + Math.max(18, 18 * s) + "px 'Baloo 2','Comic Sans MS',sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("SCORE", 60, 48);
  score.render(ctx, 170, 66, Math.max(18, 26 * s));

  /* celebration result card (beat 3: pop 0.9→1.0 + 8px rise) */
  if (cardAnim) {
    var ct = Math.min(1, (performance.now() - cardAnim.t0) / cardAnim.ms);
    var cs = 0.9 + 0.1 * D.easing.pop(ct);
    var cy = h * 0.35 - cardAnim.rise * ct;
    ctx.save();
    ctx.translate(w / 2, cy);
    ctx.scale(cs, cs);
    VG.washiPanel(ctx, -170, -70, 340, 140, { tape: C.sun });
    ctx.fillStyle = C.ink;
    ctx.font = "800 43px 'Baloo 2','Comic Sans MS',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("LEVEL CLEAR!", 0, -14);
    ctx.font = "700 24px 'Fredoka','Comic Sans MS',sans-serif";
    ctx.fillText("What a run!", 0, 30);
    ctx.restore();
  }

  flash.render(ctx, w, h);
  ctx.restore();
}

loop.start();
})();
</script>
</body>
</html>
